<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="sl" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="2" fill="#00ff41" opacity="0.06"/>
    </pattern>

    <!-- glow filter for ASCII text -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- stronger glow for scanline -->
    <filter id="scanGlow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

      @keyframes glitch{
        0%,80%,100%{transform:translate(0,0);opacity:1}
        81%{transform:translate(-4px,0);opacity:.9}
        82%{transform:translate(4px,1px);opacity:.85}
        83%{transform:translate(-3px,0);opacity:.95}
        84%{transform:translate(3px,-1px);opacity:.9}
        85%{transform:translate(-2px,0);opacity:1}
        86%{transform:translate(0,0);opacity:1}
        93%{transform:translate(0,0);opacity:1}
        93.5%{transform:translate(2px,0);opacity:.8}
        94%{transform:translate(-2px,0);opacity:.9}
        94.5%{transform:translate(0,0);opacity:1}
      }

      @keyframes glitchR{
        0%,80%,100%{transform:translate(0,0);opacity:0}
        81%{transform:translate(5px,0);opacity:.15}
        82%{transform:translate(-5px,1px);opacity:.12}
        83%{transform:translate(4px,0);opacity:.1}
        86%{transform:translate(0,0);opacity:0}
      }

      @keyframes glitchB{
        0%,80%,100%{transform:translate(0,0);opacity:0}
        81%{transform:translate(-5px,0);opacity:.12}
        82%{transform:translate(5px,-1px);opacity:.1}
        83%{transform:translate(-4px,0);opacity:.08}
        86%{transform:translate(0,0);opacity:0}
      }

      @keyframes flicker{
        0%,88%,100%{opacity:1}
        89%{opacity:.7}
        90%{opacity:1}
        92%{opacity:.5}
        93%{opacity:.9}
        95%{opacity:.6}
        96%{opacity:1}
        98%{opacity:.75}
        99%{opacity:1}
      }

      @keyframes subtitleType{
        0%{opacity:0;letter-spacing:-2px}
        30%{opacity:0;letter-spacing:-2px}
        60%{opacity:.7;letter-spacing:0}
        100%{opacity:.6;letter-spacing:.5px}
      }

      @keyframes scanMove{
        0%{transform:translateY(-6px)}
        100%{transform:translateY(286px)}
      }

      @keyframes scanMove2{
        0%{transform:translateY(-6px)}
        100%{transform:translateY(286px)}
      }

      @keyframes cornerPulse{
        0%,100%{opacity:.4}
        50%{opacity:.9}
      }

      @keyframes matrixDrip1{
        0%{transform:translateY(-20px);opacity:0}
        5%{opacity:.7}
        80%{opacity:.5}
        100%{transform:translateY(300px);opacity:0}
      }
      @keyframes matrixDrip2{
        0%{transform:translateY(-20px);opacity:0}
        8%{opacity:.6}
        75%{opacity:.4}
        100%{transform:translateY(300px);opacity:0}
      }
      @keyframes matrixDrip3{
        0%{transform:translateY(-20px);opacity:0}
        6%{opacity:.5}
        70%{opacity:.35}
        100%{transform:translateY(300px);opacity:0}
      }

      @keyframes glowPulse{
        0%,100%{filter:url(#glow);opacity:1}
        50%{opacity:.88}
      }

      .m{font-family:'Courier New',Courier,monospace}
      .ascii{font-family:'Courier New',Courier,monospace;font-size:12px;fill:#00ff41;
             animation:flicker 8s infinite, glowPulse 3s ease-in-out infinite;
             filter:url(#glow)}
      .ascii-r{font-family:'Courier New',Courier,monospace;font-size:12px;fill:#ff0040;
               animation:glitchR 8s infinite;pointer-events:none}
      .ascii-b{font-family:'Courier New',Courier,monospace;font-size:12px;fill:#00aaff;
               animation:glitchB 8s infinite;pointer-events:none}
      .gMain{animation:glitch 8s infinite}
      .c{fill:#00ff41;animation:blink 1s step-end infinite}
      .corner{animation:cornerPulse 2.5s ease-in-out infinite}
      .subtitle{animation:subtitleType 3s ease-out forwards}
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="280" fill="#080808"/>

  <!-- subtle grid -->
  <line x1="0" y1="140" x2="900" y2="140" stroke="#00ff41" stroke-width=".2" opacity=".04"/>
  <line x1="450" y1="0" x2="450" y2="280" stroke="#00ff41" stroke-width=".2" opacity=".04"/>

  <!-- corner accent lines with pulse -->
  <g class="corner">
    <line x1="9" y1="9"   x2="60"  y2="9"   stroke="#00ff41" stroke-width="1"/>
    <line x1="9" y1="9"   x2="9"   y2="55"  stroke="#00ff41" stroke-width="1"/>
    <line x1="840" y1="9"  x2="891" y2="9"  stroke="#00ff41" stroke-width="1"/>
    <line x1="891" y1="9"  x2="891" y2="55" stroke="#00ff41" stroke-width="1"/>
    <line x1="9"   y1="271" x2="60"  y2="271" stroke="#00ff41" stroke-width="1"/>
    <line x1="9"   y1="225" x2="9"   y2="271" stroke="#00ff41" stroke-width="1"/>
    <line x1="840" y1="271" x2="891" y2="271" stroke="#00ff41" stroke-width="1"/>
    <line x1="891" y1="225" x2="891" y2="271" stroke="#00ff41" stroke-width="1"/>
    <!-- corner dots -->
    <circle cx="9"   cy="9"   r="2" fill="#00ff41"/>
    <circle cx="891" cy="9"   r="2" fill="#00ff41"/>
    <circle cx="9"   cy="271" r="2" fill="#00ff41"/>
    <circle cx="891" cy="271" r="2" fill="#00ff41"/>
  </g>

  <!-- separator lines -->
  <line x1="9" y1="42" x2="891" y2="42" stroke="#00ff41" stroke-width=".4" opacity=".3"/>
  <line x1="9" y1="238" x2="891" y2="238" stroke="#00ff41" stroke-width=".4" opacity=".3"/>

  <!-- top left label -->
  <text x="16" y="30" class="m" font-size="10" fill="#00ff41" opacity=".6">root@krithiikaa:~$</text>

  <!-- top right label -->
  <text x="884" y="30" class="m" font-size="10" fill="#00ff41" opacity=".6" text-anchor="end">[ ACCESS : GRANTED ]</text>

  <!-- whoami prompt -->
  <text x="16" y="57" class="m" font-size="10" fill="#00ff41" opacity=".35">$ whoami</text>
  <rect x="72" y="46" width="6" height="11" class="c" opacity=".6"/>

  <!-- ══ Matrix drip columns (background ambience) ══ -->
  <text x="55"  y="0" class="m" font-size="9" fill="#00ff41" opacity=".18" style="animation:matrixDrip1 7s 0.5s infinite">1<tspan x="55" dy="12">0</tspan><tspan x="55" dy="12">1</tspan><tspan x="55" dy="12">█</tspan><tspan x="55" dy="12">0</tspan><tspan x="55" dy="12">1</tspan><tspan x="55" dy="12">╗</tspan><tspan x="55" dy="12">0</tspan></text>
  <text x="830" y="0" class="m" font-size="9" fill="#00ff41" opacity=".15" style="animation:matrixDrip2 9s 2s infinite">0<tspan x="830" dy="12">1</tspan><tspan x="830" dy="12">╔</tspan><tspan x="830" dy="12">1</tspan><tspan x="830" dy="12">0</tspan><tspan x="830" dy="12">█</tspan><tspan x="830" dy="12">1</tspan></text>
  <text x="200" y="0" class="m" font-size="9" fill="#00ff41" opacity=".1" style="animation:matrixDrip3 11s 4s infinite">█<tspan x="200" dy="12">1</tspan><tspan x="200" dy="12">0</tspan><tspan x="200" dy="12">1</tspan><tspan x="200" dy="12">╝</tspan><tspan x="200" dy="12">0</tspan><tspan x="200" dy="12">1</tspan></text>
  <text x="700" y="0" class="m" font-size="9" fill="#00ff41" opacity=".1" style="animation:matrixDrip1 8s 6s infinite">1<tspan x="700" dy="12">╠</tspan><tspan x="700" dy="12">0</tspan><tspan x="700" dy="12">1</tspan><tspan x="700" dy="12">0</tspan><tspan x="700" dy="12">█</tspan><tspan x="700" dy="12">1</tspan></text>

  <!-- ══ ASCII art block — centered: x=179 pins the left edge of a 542px-wide 75-char block ══ -->

  <!-- Blue ghost layer (chromatic aberration) -->
  <g class="ascii-b">
    <text text-anchor="start" xml:space="preserve">
      <tspan x="179" y="97" >██╗  ██╗██╗██████╗ ██╗   ██╗████████╗██╗ ██████╗  █████╗  █████╗   ██╗  ██╗</tspan>
      <tspan x="179" dy="17">██║ ██╔╝██║██╔══██╗██║   ██║╚══██╔══╝██║██╔════╝ ██╔══██╗██╔══██╗  ██╔═██╔╝</tspan>
      <tspan x="179" dy="17">█████╔╝ ██║██████╔╝██║   ██║   ██║   ██║██║  ███╗███████║███████║  █████╔╝ </tspan>
      <tspan x="179" dy="17">██╔═██╗ ██║██╔══██╗██║   ██║   ██║   ██║██║   ██║██╔══██║██╔══██║  ██╔═██╗ </tspan>
      <tspan x="179" dy="17">██║  ██╗██║██║  ██║╚██████╔╝   ██║   ██║╚██████╔╝██║  ██║██║  ██║  ██║  ██╗</tspan>
      <tspan x="179" dy="17">╚═╝  ╚═╝╚═╝╚═╝  ╚═╝ ╚═════╝    ╚═╝   ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝  ╚═╝  ╚═╝</tspan>
    </text>
  </g>

  <!-- Red ghost layer (chromatic aberration) -->
  <g class="ascii-r">
    <text text-anchor="start" xml:space="preserve">
      <tspan x="179" y="97" >██╗  ██╗██╗██████╗ ██╗   ██╗████████╗██╗ ██████╗  █████╗  █████╗   ██╗  ██╗</tspan>
      <tspan x="179" dy="17">██║ ██╔╝██║██╔══██╗██║   ██║╚══██╔══╝██║██╔════╝ ██╔══██╗██╔══██╗  ██╔═██╔╝</tspan>
      <tspan x="179" dy="17">█████╔╝ ██║██████╔╝██║   ██║   ██║   ██║██║  ███╗███████║███████║  █████╔╝ </tspan>
      <tspan x="179" dy="17">██╔═██╗ ██║██╔══██╗██║   ██║   ██║   ██║██║   ██║██╔══██║██╔══██║  ██╔═██╗ </tspan>
      <tspan x="179" dy="17">██║  ██╗██║██║  ██║╚██████╔╝   ██║   ██║╚██████╔╝██║  ██║██║  ██║  ██║  ██╗</tspan>
      <tspan x="179" dy="17">╚═╝  ╚═╝╚═╝╚═╝  ╚═╝ ╚═════╝    ╚═╝   ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝  ╚═╝  ╚═╝</tspan>
    </text>
  </g>

  <!-- Main green ASCII layer -->
  <g class="gMain">
    <text class="ascii" text-anchor="start" xml:space="preserve">
      <tspan x="179" y="97" >██╗  ██╗██╗██████╗ ██╗   ██╗████████╗██╗ ██████╗  █████╗  █████╗   ██╗  ██╗</tspan>
      <tspan x="179" dy="17">██║ ██╔╝██║██╔══██╗██║   ██║╚══██╔══╝██║██╔════╝ ██╔══██╗██╔══██╗  ██╔═██╔╝</tspan>
      <tspan x="179" dy="17">█████╔╝ ██║██████╔╝██║   ██║   ██║   ██║██║  ███╗███████║███████║  █████╔╝ </tspan>
      <tspan x="179" dy="17">██╔═██╗ ██║██╔══██╗██║   ██║   ██║   ██║██║   ██║██╔══██║██╔══██║  ██╔═██╗ </tspan>
      <tspan x="179" dy="17">██║  ██╗██║██║  ██║╚██████╔╝   ██║   ██║╚██████╔╝██║  ██║██║  ██║  ██║  ██╗</tspan>
      <tspan x="179" dy="17">╚═╝  ╚═╝╚═╝╚═╝  ╚═╝ ╚═════╝    ╚═╝   ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝  ╚═╝  ╚═╝</tspan>
    </text>
  </g>

  <!-- subtitle with type-in animation -->
  <text x="450" y="222" class="m subtitle" font-size="11" fill="#00ff41" text-anchor="middle">✨ AI Product Engineer • Full-Stack Builder • Targeting 🎯 ZOHO • ✨</text>

  <!-- bottom left -->
  <text x="16" y="256" class="m" font-size="10" fill="#00ff41" opacity=".4">B.E. CSE  ·  UCE Kancheepuram</text>

  <!-- bottom right -->
  <text x="884" y="256" class="m" font-size="10" fill="#00ff41" opacity=".4" text-anchor="end">github.com/Krithiikaa</text>

  <!-- ══ Scanline 1 — bright, visible ══ -->
  <rect width="900" height="4" fill="#00ff41" opacity=".22" filter="url(#scanGlow)">
    <animateTransform attributeName="transform" type="translate" from="0 -6" to="0 286" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ══ Scanline 2 — slightly different speed/opacity ══ -->
  <rect width="900" height="2" fill="#00ff41" opacity=".12">
    <animateTransform attributeName="transform" type="translate" from="0 -6" to="0 286" dur="7s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline horizontal stripe overlay -->
  <rect width="900" height="280" fill="url(#sl)"/>
</svg>
