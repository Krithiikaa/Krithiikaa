<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="sl" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#000" opacity="0.18"/>
    </pattern>
    <style>
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes glitch{
        0%,84%,100%{transform:translate(0,0)}
        85%{transform:translate(-3px,0)}
        86%{transform:translate(3px,0)}
        87%{transform:translate(-2px,0)}
        88%{transform:translate(2px,0)}
        89%{transform:translate(-1px,0)}
        90%{transform:translate(0,0)}
      }
      @keyframes flicker{
        0%,91%,100%{opacity:1}
        92%{opacity:.75}
        93%{opacity:1}
        95%{opacity:.6}
        96%{opacity:.95}
        97%{opacity:.7}
        99%{opacity:1}
      }
      @keyframes pulse{
        0%,100%{opacity:.3}
        50%{opacity:.55}
      }
      .m{font-family:'Courier New',Courier,monospace}
      .a{font-family:'Courier New',Courier,monospace;font-size:12px;fill:#00ff41;animation:flicker 9s infinite}
      .g{animation:glitch 16s infinite}
      .c{fill:#00ff41;animation:blink 1s step-end infinite}
      .p{animation:pulse 4s ease-in-out infinite}
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="280" fill="#080808"/>

  <!-- corner accent lines -->
  <line x1="9" y1="9"   x2="60"  y2="9"   stroke="#00ff41" stroke-width=".7" opacity=".5"/>
  <line x1="9" y1="9"   x2="9"   y2="55"  stroke="#00ff41" stroke-width=".7" opacity=".5"/>
  <line x1="840" y1="9"  x2="891" y2="9"   stroke="#00ff41" stroke-width=".7" opacity=".5"/>
  <line x1="891" y1="9"  x2="891" y2="55"  stroke="#00ff41" stroke-width=".7" opacity=".5"/>
  <line x1="9"   y1="271" x2="60"  y2="271" stroke="#00ff41" stroke-width=".7" opacity=".5"/>
  <line x1="9"   y1="225" x2="9"   y2="271" stroke="#00ff41" stroke-width=".7" opacity=".5"/>
  <line x1="840" y1="271" x2="891" y2="271" stroke="#00ff41" stroke-width=".7" opacity=".5"/>
  <line x1="891" y1="225" x2="891" y2="271" stroke="#00ff41" stroke-width=".7" opacity=".5"/>

  <!-- separator lines -->
  <line x1="9" y1="42" x2="891" y2="42" stroke="#00ff41" stroke-width=".3" opacity=".2"/>
  <line x1="9" y1="238" x2="891" y2="238" stroke="#00ff41" stroke-width=".3" opacity=".2"/>

  <!-- top left label -->
  <text x="16" y="30" class="m" font-size="10" fill="#00ff41" opacity=".5">root@krithiikaa:~$</text>

  <!-- top right label -->
  <text x="884" y="30" class="m" font-size="10" fill="#00ff41" opacity=".5" text-anchor="end">[ ACCESS : GRANTED ]</text>

  <!-- whoami prompt -->
  <text x="16" y="57" class="m" font-size="10" fill="#00ff41" opacity=".28">$ whoami</text>
  <!-- blinking cursor after prompt -->
  <rect x="72" y="46" width="6" height="11" class="c" opacity=".45"/>

