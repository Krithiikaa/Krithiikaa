  <!-- subtitle -->
  <text x="450" y="220" class="m" font-size="11" fill="#00ff41" opacity=".55" text-anchor="middle">✦  AI Product Engineer  ·  Full-Stack Builder  ·  @Krithiikaa  ✦</text>

  <!-- bottom left -->
  <text x="16" y="256" class="m" font-size="10" fill="#00ff41" opacity=".32">B.E. CSE  ·  CGPA 8.52  ·  UCE Kancheepuram</text>

  <!-- bottom right -->
  <text x="884" y="256" class="m" font-size="10" fill="#00ff41" opacity=".32" text-anchor="end">github.com/Krithiikaa</text>

  <!-- moving scanline SMIL -->
  <rect width="900" height="3" fill="#00ff41" opacity=".05">
    <animateTransform attributeName="transform" type="translate" from="0 -3" to="0 283" dur="6s" repeatCount="indefinite"/>
  </rect>

